name: 데이터 자동 수집

# 비공개 저장소 sangga-collector 에서만 돈다 (공개 저장소 sangga-status 는 사이트 화면만).
# 한국부동산원 R-ONE 은 해외(GitHub 서버) 접속을 끊어서 여기서는 받지 않는다.
# R-ONE(분기 자료)은 국내 PC에서 받아 seed 브랜치로 올리면 seed.yml 이 Supabase 로 옮긴다.

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
    inputs:
      skip_trade:
        description: "매매 실거래가 수집 건너뛰기 (API 하루 한도를 이미 썼을 때)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-data
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'jjangkyungho/sangga-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 수집 데이터 받기 (Supabase)
        id: pull
        run: python scripts/supabase_sync.py pull

      - name: 1. 상가 매매 실거래가
        if: ${{ !inputs.skip_trade }}
        continue-on-error: true
        run: python scripts/fetch_trade.py

      - name: 3. 상권 점포 현황
        continue-on-error: true
        run: python scripts/fetch_stores.py

      - name: 바뀐 데이터 올리기 (Supabase)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: python scripts/supabase_sync.py push
